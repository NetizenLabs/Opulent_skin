  <script>
    async function fetchInventory() {
      const tbody = document.getElementById('inventory-table-body');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading live inventory...</td></tr>';
      
      try {
        const res = await fetch('/api/products');
        const list = await res.json();
        document.getElementById('total-count').innerText = list.length;

        tbody.innerHTML = list.map(item => `
          <tr>
            <td><img src="${item.image}" class="admin-img-thumb" alt="${item.title}"></td>
            <td><strong>${item.title}</strong><br><small style="color:var(--text-muted);">${item.volume}</small></td>
            <td><span style="text-transform:uppercase; font-size:0.75rem; font-weight:700;">${item.category}</span></td>
            <td><strong>PKR ${item.price.toLocaleString()}</strong></td>
            <td><button class="btn-delete" onclick="deleteProduct('${item.id}')">Delete</button></td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:red; text-align:center;">Error loading live products.</td></tr>';
      }
    }

    async function handleAddProduct(e) {
      e.preventDefault();
      const newProd = {
        id: 'ops-' + Date.now().toString().slice(-4),
        title: document.getElementById('p-title').value.trim(),
        category: document.getElementById('p-cat').value,
        price: Number(document.getElementById('p-price').value),
        volume: document.getElementById('p-vol').value.trim(),
        badge: document.getElementById('p-badge').value.trim(),
        image: document.getElementById('p-img').value.trim(),
        description: document.getElementById('p-desc').value.trim(),
        oldPrice: null
      };

      const res = await fetch('/api/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newProd)
      });

      if (res.ok) {
        alert(`Published "${newProd.title}" successfully to Vercel live servers!`);
        e.target.reset();
        fetchInventory();
      } else {
        alert("Failed to save product to the server.");
      }
    }

    async function deleteProduct(id) {
      if (confirm("Remove this product from the live catalog?")) {
        const res = await fetch(`/api/products?id=${id}`, { method: 'DELETE' });
        if (res.ok) {
          fetchInventory();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', fetchInventory);
  </script>
